{% extends "base.html" %}
{% block title %}Welcome - Bhavani Residency{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center">
  <div class="text-center space-y-6 max-w-2xl">
    <div class="w-24 h-24 bg-gradient-to-tr from-sky-400 to-blue-600 rounded-3xl mx-auto flex items-center justify-center shadow-2xl shadow-blue-500/40 rotate-12">
      <i data-lucide="building-2" class="w-12 h-12 text-white -rotate-12"></i>
    </div>
    
    <h1 class="text-5xl font-black text-slate-800 dark:text-white tracking-tight">
      Bhavani <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-sky-400">Residency</span>
    </h1>
    <p class="text-lg text-slate-500 dark:text-slate-400 font-medium">
      Smart Hostel Management System. Please select your role to continue.
    </p>
    
    <div class="flex flex-col sm:flex-row gap-4 justify-center mt-8">
      <a href="/login" class="px-8 py-4 bg-white dark:bg-slate-800 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-slate-900/50 border border-slate-100 dark:border-slate-700 font-bold text-lg text-slate-800 dark:text-white hover:-translate-y-1 hover:shadow-2xl transition-all flex items-center justify-center">
        <i data-lucide="shield" class="w-6 h-6 mr-3 text-blue-500"></i> Admin Login
      </a>
      <a href="/tenant/add" class="px-8 py-4 bg-gradient-to-r from-blue-600 to-sky-500 rounded-2xl shadow-xl shadow-blue-500/30 font-bold text-lg text-white hover:-translate-y-1 hover:shadow-2xl transition-all flex items-center justify-center">
        <i data-lucide="user-plus" class="w-6 h-6 mr-3"></i> Student Registration
      </a>
    </div>
    
    <div class="mt-8 text-sm font-medium text-slate-400">
      Existing student? <a href="/login" class="text-blue-500 hover:underline">Login here</a>.
    </div>
  </div>
</div>
{% endblock %}
