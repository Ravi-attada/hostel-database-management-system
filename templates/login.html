{% extends "base.html" %}
{% block title %}Login - Bhavani Residency{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md glass-card p-8 rounded-3xl shadow-2xl border-t-4 border-t-blue-500">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-2xl mx-auto flex items-center justify-center mb-4">
        <i data-lucide="log-in" class="w-8 h-8"></i>
      </div>
      <h2 class="text-3xl font-black text-slate-800 dark:text-white tracking-tight">Welcome Back</h2>
      <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium">Login to access your dashboard</p>
    </div>
    
    <form method="POST" action="/login" class="space-y-5">
      <div>
        <label class="text-sm font-bold text-slate-700 dark:text-slate-300 block mb-2">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-slate-400"></i>
          <input required type="email" name="email" class="w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl pl-11 pr-4 py-3 text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
      </div>
      <div>
        <label class="text-sm font-bold text-slate-700 dark:text-slate-300 block mb-2">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-4 top-3.5 w-5 h-5 text-slate-400"></i>
          <input required type="password" name="password" class="w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl pl-11 pr-4 py-3 text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all">
        </div>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition-all mt-4">
        Sign In
      </button>
    </form>
    
    <div class="text-center mt-6 text-sm text-slate-500 dark:text-slate-400 font-medium">
      No account? <a href="/tenant/add" class="text-blue-600 dark:text-blue-400 hover:underline">Register as Student</a>
      <br>
      <a href="/admin/register" class="text-sky-600 dark:text-sky-400 hover:underline mt-2 inline-block">Setup First Admin</a>
    </div>
  </div>
</div>
{% endblock %}
