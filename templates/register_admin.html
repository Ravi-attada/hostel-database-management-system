{% extends "base.html" %}
{% block title %}Admin Setup - Bhavani Residency{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md glass-card p-8 rounded-3xl shadow-2xl border-t-4 border-t-purple-500">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 rounded-2xl mx-auto flex items-center justify-center mb-4">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h2 class="text-3xl font-black text-slate-800 dark:text-white tracking-tight">Admin Setup</h2>
      <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium">Register the primary owner account</p>
    </div>
    
    <form method="POST" action="/admin/register" class="space-y-5">
      <div>
        <label class="text-sm font-bold text-slate-700 dark:text-slate-300 block mb-2">Admin Email</label>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-slate-400"></i>
          <input required type="email" name="email" class="w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl pl-11 pr-4 py-3 text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition-all">
        </div>
      </div>
      <div>
        <label class="text-sm font-bold text-slate-700 dark:text-slate-300 block mb-2">Secure Password</label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-4 top-3.5 w-5 h-5 text-slate-400"></i>
          <input required type="password" name="password" class="w-full bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-xl pl-11 pr-4 py-3 text-slate-800 dark:text-white focus:ring-2 focus:ring-purple-500 transition-all">
        </div>
      </div>
      <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-purple-500/30 transition-all mt-4">
        Create Admin Account
      </button>
    </form>
  </div>
</div>
{% endblock %}
